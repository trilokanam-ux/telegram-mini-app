<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: linear-gradient(135deg, #080b10, #151b24);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 100%;
            padding: 25px;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: linear-gradient(145deg, #d4af37, #f5d76e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            color: #111;
            box-shadow: 0 0 30px rgba(212,175,55,0.3);
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 22px;
        }

        .circle {
            width: 125px;
            height: 125px;
            margin: auto;
            border-radius: 50%;
            border: 3px solid rgba(212,175,55,0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .circle::before {
            content: "";
            position: absolute;
            width: 125px;
            height: 125px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #d4af37;
            animation: spin 0.7s linear infinite;
        }

        #number {
            font-size: 62px;
            font-weight: bold;
            color: #f5d76e;
        }

        .message {
            margin-top: 22px;
            color: #aeb6c2;
            font-size: 14px;
        }

        .channel {
            margin-top: 12px;
            color: #d4af37;
            font-size: 14px;
            font-weight: bold;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">G</div>

    <div class="title">
        Redirecting...
    </div>

    <div class="circle">
        <div id="number">3</div>
    </div>

    <div class="message">
        Please wait...
    </div>

    <div class="channel">
        Gold Trading Channel
    </div>

</div>

<script>

    Telegram.WebApp.ready();

    const number = document.getElementById("number");

    // Fast countdown
    setTimeout(() => {
        number.innerText = "2";
    }, 700);

    setTimeout(() => {
        number.innerText = "1";
    }, 1400);

    // Immediately open channel
    setTimeout(() => {

        Telegram.WebApp.openTelegramLink(
            "https://t.me/+RD4oOWbh9xZhZDU1"
        );

    }, 2100);

</script>

</body>
</html>
