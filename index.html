<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #071027;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .card {
            width: calc(100% - 40px);
            max-width: 360px;
            background: #1d2d49;
            border-radius: 28px;
            padding: 32px 22px 28px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .loader {
            width: 48px;
            height: 48px;
            margin: 0 auto 24px;
            border: 7px solid #405174;
            border-top-color: #756cff;
            border-right-color: #756cff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            height: 32px;
            padding: 0 8px;
            margin: 0 3px;
            border-radius: 10px;
            background: #405d89;
            font-size: 18px;
        }

        .divider {
            height: 1px;
            background: #34435c;
            margin: 25px 0;
        }

        .message {
            margin: 0 0 25px;
            color: #91a0b8;
            font-size: 15px;
        }

        .redirect-button {
            display: block;
            width: 100%;
            padding: 14px 18px;
            border-radius: 30px;
            background: #2b86f5;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .redirect-button:active {
            transform: scale(0.98);
        }

        .secure {
            margin-top: 24px;
            color: #7f8da5;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="loader"></div>

        <h2>
            Redirecting
            <span class="count" id="count">2</span>
            s
        </h2>

        <div class="divider"></div>

        <p class="message">Redirecting...</p>

        <a id="redirectButton" class="redirect-button" href="https://t.me/+bpkQZtwGPEs5M2M1">
            ⚡️ Click here if not redirected
        </a>

        <div class="divider"></div>

        <div class="secure">
            🔒 secure connection
        </div>

    </div>

    <script>
        const destination = "https://t.me/+bpkQZtwGPEs5M2M1";

        let seconds = 2;

        const counter = document.getElementById("count");

        const timer = setInterval(function () {

            seconds--;

            counter.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);

                window.location.href = destination;
            }

        }, 1000);
    </script>

</body>

</html>
